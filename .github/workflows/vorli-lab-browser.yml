# QA only: never builds or deploys site/, never accesses secrets or payments.
# Scoped to PRs targeting unpublished VORLI lab branches, never main.
name: VORLI Lab browser evidence
on:
  pull_request:
    branches:
      - vorli/catalog-qa-regression-20261023
      - vorli/catalog-browser-ci-20261024
      - vorli/catalog-accessibility-regression-20261025
    paths:
      - 'preview/vorli-next/**'
      - 'tests/**'
      - '.github/workflows/vorli-lab-browser.yml'

permissions:
  contents: read

jobs:
  catalog-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR snapshot
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: Node catalog regressions
        run: node --test tests/catalog-progressive.test.cjs
      - name: Python syntax
        run: python -m compileall -q agent tests
      - name: Install browser test dependency
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test real catalog in Chromium (responsive and accessibility modes)
        run: python tests/browser_catalog_lab.py
      - name: Preserve screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorli-catalog-lab-browser-evidence
          path: artifacts/catalog-lab/
          if-no-files-found: ignore
          retention-days: 7
