name: VORLI commerce safety
on:
  push:
    branches: [main, 'vorli/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate commerce safety
        run: python agent/validate_commerce.py
