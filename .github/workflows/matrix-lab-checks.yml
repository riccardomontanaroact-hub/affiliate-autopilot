name: VORLI Lab matrix checks

on:
  pull_request:
    paths:
      - 'preview/vorli-next/**'
      - 'tests/test_matrix_*.py'
      - '.github/workflows/matrix-lab-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all matrix unit tests
        run: python -m unittest discover -s tests -p 'test_matrix_*.py' -v
