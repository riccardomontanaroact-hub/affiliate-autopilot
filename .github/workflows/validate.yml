name: Validate VORLI changes
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile Python modules
        run: python -m compileall -q agent
      - name: Test five-agent runner
        run: python -m unittest discover -s tests -v
      - name: Build site and catalogue
        run: python agent/build.py
      - name: Set up Node for privacy preflight
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block personal data and affiliate tracking in draft public files
        run: node tests/privacy-public-files-smoke.js
      - name: Check patch whitespace
        run: git diff --check
