name: Validate VORLI changes
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile Python modules
        run: python -m compileall -q agent
      - name: Test five-agent runner
        run: python -m unittest discover -s tests -v
      - name: Build site and catalogue
        run: python agent/build.py
      - name: Check patch whitespace
        run: git diff --check

  render-guide-preview:
    if: contains(github.event.pull_request.title, 'printable layout')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Render and test HTML on mobile and desktop
        run: |
          mkdir -p preview-output
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
              await page.goto('file://' + path.resolve('vault/products/casa-smart-senza-sorprese-layout-bozza-02.html'), { waitUntil: 'load' });
              if (await page.title() !== 'VORLI — Casa Smart senza sorprese') throw new Error('Titolo HTML inatteso');
              const anchors = await page.locator('a[href^="#"]').evaluateAll(links => links.map(a => a.getAttribute('href').slice(1)));
              const ids = await page.locator('[id]').evaluateAll(nodes => nodes.map(n => n.id));
              const missing = anchors.filter(id => !ids.includes(id));
              if (missing.length) throw new Error('Ancore interne senza destinazione: ' + missing.join(', '));
              const toggle = page.locator('button.secondary[aria-controls="draft-notes"]');
              if (!(await toggle.getAttribute('aria-label')) && !(await toggle.innerText()).trim()) throw new Error('Pulsante note senza etichetta accessibile');
              await toggle.click();
              if (await toggle.getAttribute('aria-expanded') !== 'false') throw new Error('Il pulsante note non aggiorna aria-expanded');
              if (await toggle.innerText() !== 'Mostra note di bozza') throw new Error('Il testo del pulsante non descrive lo stato chiuso');
              if (await page.locator('#draft-notes').isVisible()) throw new Error('La nota di bozza dovrebbe essere nascosta dopo il click');
              await toggle.click();
              if (await toggle.getAttribute('aria-expanded') !== 'true') throw new Error('Il pulsante note non ripristina aria-expanded');
              if (await toggle.innerText() !== 'Nascondi note di bozza') throw new Error('Il testo del pulsante non descrive lo stato aperto');
              const external = await page.locator('a[href^="https://"]').evaluateAll(links => links.map(a => new URL(a.href).hostname));
              const allowed = ['consumer.ftc.gov', 'www.ncsc.gov.uk', 'digital-strategy.ec.europa.eu'];
              if (external.length !== 3 || external.some(host => !allowed.includes(host)) || allowed.some(host => !external.includes(host))) throw new Error('Le fonti esterne non corrispondono alla lista istituzionale prevista');
              await page.setViewportSize({ width: 360, height: 800 });
              if (await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth)) throw new Error('Overflow orizzontale a 360 px');
              await page.setViewportSize({ width: 390, height: 844 });
              if (await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth)) throw new Error('Overflow orizzontale a 390 px');
              await page.screenshot({ path: 'preview-output/mobile.png', fullPage: true });
              await page.setViewportSize({ width: 1440, height: 1000 });
              await page.screenshot({ path: 'preview-output/desktop.png', fullPage: true });
              await page.emulateMedia({ media: 'print' });
              await page.pdf({ path: 'preview-output/guide-a4.pdf', format: 'A4', printBackground: true, preferCSSPageSize: true });
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          pdfinfo preview-output/guide-a4.pdf | tee preview-output/pdf-info.txt
          grep -Eq '^Pages:[[:space:]]+[1-9][0-9]*' preview-output/pdf-info.txt
          pages=$(awk '/^Pages:/ {print $2}' preview-output/pdf-info.txt)
          section_page=""
          final_page=""
          for page_number in $(seq 1 "$pages"); do
            page_text=$(pdftotext -f "$page_number" -l "$page_number" -layout preview-output/guide-a4.pdf -)
            if printf '%s' "$page_text" | grep -Fq '5. Compro o aspetto?' && printf '%s' "$page_text" | grep -Fq 'La mia decisione'; then
              section_page="$page_number"
            fi
            if printf '%s' "$page_text" | grep -Fq 'Fonti da controllare prima della pubblicazione' && printf '%s' "$page_text" | grep -Fq 'VORLI · Casa Smart senza sorprese'; then
              final_page="$page_number"
            fi
          done
          test -n "$section_page" || (echo "La sezione 'Compro o aspetto?' e la decisione sono state separate nel PDF" && exit 1)
          test -n "$final_page" || (echo "Il piè di pagina è rimasto isolato su una pagina separata" && exit 1)
          echo "Sezione decisionale verificata a pagina $section_page; fonti e piè di pagina insieme a pagina $final_page."
      - name: Upload temporary screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorli-guide-preview-${{ github.run_number }}
          path: preview-output/
          if-no-files-found: warn
          retention-days: 3
