name: Build and deploy VORLI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python agent/build.py
      - name: Report publication mode
        run: |
          python - <<'PY'
          import json
          from agent.offer_validation import is_publishable
          with open("data/products.json", encoding="utf-8") as handle:
              products = json.load(handle)
          count = sum(1 for product in products if is_publishable(product))
          print(f"Verified publishable offers: {count}")
          if count < 1:
              print("::notice::Deploying a non-commercial pre-launch preview. No verified affiliate offers will be active.")
          else:
              print("Verified offers found; product links will be published only when the existing validation rules pass.")
          PY
      - name: Exclude internal dashboard from public artifact
        run: rm -f site/dashboard.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
