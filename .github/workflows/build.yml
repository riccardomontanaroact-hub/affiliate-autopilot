name: Build and deploy VORLI
run-name: VORLI build and deploy — ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build VORLI site
        run: python agent/build.py

      # Only main is allowed to persist generated catalog changes.
      - name: Commit generated catalog
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'affiliate-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add site data/ranked_products.json
          git diff --cached --quiet || git commit -m 'Automated catalog rebuild'
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Do not change repository Pages settings automatically; owner must verify them first.
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    # Fail closed: deployment requires an explicit repository variable approved by the owner.
    if: github.ref == 'refs/heads/main' && vars.VORLI_ENABLE_PAGES_DEPLOY == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
