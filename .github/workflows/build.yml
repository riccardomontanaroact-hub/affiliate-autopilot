name: Build and deploy VORLI
run-name: VORLI build and deploy — ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build VORLI site
        run: python agent/build.py

      - name: Exclude internal dashboard from public site
        run: rm -f site/dashboard.html

      # Fail closed if internal files accidentally enter the Pages upload tree.
      - name: Verify public artifact has no internal files
        run: |
          python - <<'PY'
          from pathlib import Path

          site = Path("site")
          if not site.is_dir():
              raise SystemExit("Public site directory missing")
          forbidden_names = {"dashboard.html", "config.json", ".env", ".env.local"}
          forbidden_suffixes = {".pem", ".key", ".p12", ".sqlite", ".db"}
          forbidden_dirs = {".git", "__pycache__"}
          violations = [
              p for p in site.rglob("*")
              if p.is_symlink()
              or p.name in forbidden_names
              or p.suffix.lower() in forbidden_suffixes
              or any(part in forbidden_dirs for part in p.relative_to(site).parts)
          ]
          if violations:
              # Do not echo paths: filenames themselves may contain private data.
              raise SystemExit(f"Blocked {len(violations)} unsafe path(s) in Pages artifact")
          print("Pages artifact privacy guard passed")
          PY

      # Only main is allowed to persist generated catalog changes.
      - name: Commit generated catalog
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'affiliate-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add site data/ranked_products.json
          git diff --cached --quiet || git commit -m 'Automated catalog rebuild'
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
