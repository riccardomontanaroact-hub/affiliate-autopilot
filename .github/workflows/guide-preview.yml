name: Preview VORLI guide (private artifact)
run-name: Guide preview — ${{ github.event_name }} #${{ github.event.number || github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'vault/products/casa-smart-senza-sorprese-layout-bozza-02.html'
      - '.github/workflows/guide-preview.yml'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render mobile, desktop and PDF; test controls
        run: |
          mkdir -p preview-output
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
              await page.goto('file://' + path.resolve('vault/products/casa-smart-senza-sorprese-layout-bozza-02.html'), { waitUntil: 'load' });
              if (await page.title() !== 'VORLI — Casa Smart senza sorprese') throw new Error('Titolo HTML inatteso');
              const anchors = await page.locator('a[href^="#"]').evaluateAll(links => links.map(a => a.getAttribute('href').slice(1)));
              const ids = await page.locator('[id]').evaluateAll(nodes => nodes.map(n => n.id));
              const missing = anchors.filter(id => !ids.includes(id));
              if (missing.length) throw new Error('Ancora interne senza destinazione: ' + missing.join(', '));
              const toggle = page.locator('button.secondary');
              await toggle.click();
              if (await toggle.getAttribute('aria-expanded') !== 'false') throw new Error('Il pulsante note non aggiorna aria-expanded');
              if (await page.locator('.draft-note').isVisible()) throw new Error('La nota di bozza dovrebbe essere nascosta dopo il click');
              await toggle.click();
              if (await toggle.getAttribute('aria-expanded') !== 'true') throw new Error('Il pulsante note non ripristina aria-expanded');
              const mobileOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (mobileOverflow) throw new Error('Overflow orizzontale su viewport mobile');
              await page.screenshot({ path: 'preview-output/mobile.png', fullPage: true });
              await page.setViewportSize({ width: 1440, height: 1000 });
              await page.screenshot({ path: 'preview-output/desktop.png', fullPage: true });
              await page.emulateMedia({ media: 'print' });
              await page.pdf({ path: 'preview-output/guide-a4.pdf', format: 'A4', printBackground: true, preferCSSPageSize: true });
              console.log('OK: titolo, link interni, pulsante note, overflow mobile, screenshot e PDF generati.');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          pdfinfo preview-output/guide-a4.pdf | tee preview-output/pdf-info.txt
          grep -Eq '^Pages:[[:space:]]+[1-9][0-9]*' preview-output/pdf-info.txt

      - name: Upload temporary preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorli-guide-preview-${{ github.run_number }}
          path: preview-output/
          if-no-files-found: warn
          retention-days: 3
