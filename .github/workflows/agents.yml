name: VORLI agent progress report
run-name: VORLI agent report — ${{ github.event_name }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vorli-agent-report
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run five specialist agents
        run: python agent/agents.py
      - name: Upload auditable report
        uses: actions/upload-artifact@v4
        with:
          name: vorli-agent-report-${{ github.run_number }}
          path: |
            reports/agent-status.md
            reports/agent-status.json
          if-no-files-found: error
          retention-days: 30
      - name: Notify progress in GitHub issue
        if: always() && hashFiles('reports/agent-status.md') != ''
        uses: actions/github-script@v7
        env:
          REPORT_PATH: reports/agent-status.md
          PROGRESS_ISSUE: '25'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const issueNumber = Number(process.env.PROGRESS_ISSUE);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.warning('Progress issue not configured; see workflow summary and artifact.');
              return;
            }
            const body = 'Rapporto automatico del run #' + context.runNumber + '\n\n' +
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId + '\n\n' + report;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
