name: VORLI agent progress report
run-name: VORLI agent report — ${{ github.event_name }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vorli-agent-report
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run five specialist agents
        run: python agent/agents.py
      - name: Optional AI reasoning (opt-in; may incur API costs)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          VORLI_LLM_ENABLED: ${{ vars.VORLI_LLM_ENABLED }}
        run: python agent/llm_agents.py
      - name: Upload auditable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorli-agent-report-${{ github.run_number }}
          path: |
            reports/agent-status.md
            reports/agent-status.json
          if-no-files-found: error
          retention-days: 30
      - name: No
